# Digicom / prod-shaped runtime sample (sanitized).
# NOT used by local day-to-day builds — those keep db-kind=h2 in build/application.properties.
# Digicom host APP: /home/app/ota-push-services/ussdgw-micro-jainslee/
# Package for Digicom: flip quarkus.datasource.db-kind=postgresql (BUILD-TIME), run
# ./build/package-dist.sh, then restore local h2. Rsync jars/lib/quarkus/app/html only —
# never overwrite Digicom configs/ (operator SoT).
#
# Secrets (NEVER commit live values): quarkus.datasource.password, ussd.admin.api-key,
# ussd.admin.session-hmac-secret, ussd.admin.first-run-password, smpp.*password.

# --- capacity / AdaptiveTimeout / HTTP / JDBC / bridge (synced from Digicom 2026-08-08) ---
microjainslee.container.buffer-size=16384
microjainslee.container.prefer-virtual-threads=true
microjainslee.container.sbb-pool-min=128
microjainslee.container.sbb-pool-max=40960

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=ussdgw
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/ussdgw
# quarkus.datasource.password=<SET_ON_HOST>
quarkus.datasource.jdbc.max-size=128
quarkus.datasource.jdbc.min-size=16

http.ra.port=8088
http.ra.host=127.0.0.1
http.ra.event-loop-threads=8
http.ra.worker-pool-size=512
http.ra.accept-backlog=8192
ussd.http.client.max-pool-size=8192
ussd.http.client.connect-timeout-ms=5000
ussd.http.client.request-timeout-ms=15000

ussd.bridge.enabled=true
# Gate ceiling under MAP ~30s; 25s leaves headroom before dialog timeout.
ussd.bridge.async-gate-timeout-ms=25000
ussd.dialog-timeout-ms=60000
ussd.bridge.gate-tick-ms=100
ussd.bridge.http-client-enabled=true
ussd.bridge.grpc-client-enabled=true

ussd.as.http.wire-format=xml
ussd.http.ni-path=/ussd
ussd.http.ni.auth-required=true
ussd.as.pull.fail-threshold=20
ussd.as.pull.open-ms=15000
ussd.as.pull.max-retries=1

ussd.map.enabled=true
ussd.map.auto-apply-on-boot=true
ussd.map.config-file=configs/ss7-digicom-balance.json
ussd.map.opc=1470
ussd.map.ussd-gt=251971200490
# Live BP SCCP plane; lab L3-LAB-SIM uses networkId=1 in ss7-digicom-balance.json.
ussd.map.live-network-id=0
ussd.hlr.upper-gt=251900000006

ussd.tx.profile-ttl-ms=120000
ussd.cdr.enabled=true
ussd.cdr.network-id=0
ussd.cdr.db.async=true
ussd.cdr.db.batch-size=2000
ussd.cdr.db.queue-cap=100000
ussd.cdr.db.flush-every=100ms

ussd.tenant.global-max-tps=20000
# Per-tenant ceiling lives in PG ussd_tenant.max_tps (not this file). Lab/prove
# digicom-push should be ≥20000; TenantGuard treats max_tps<=0 as 50 (fail-closed).
ussd.admin.cookie-secure=true
# ussd.admin.public-base-url=<OPERATOR_HTTPS_BASE>
# ussd.admin.api-key=<OPERATOR>
# ussd.admin.session-hmac-secret=<OPERATOR>
