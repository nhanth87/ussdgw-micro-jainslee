ussd.log.dir=logs
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.file.enable=false
quarkus.config.mapping.validate-unknown=false

# micro-jainslee container — Quarkus BUILD_TIME (baked at ./build/package-dist.sh).
# Changing these in dist/configs alone does NOT resize the Disruptor / SBB pool;
# re-package after edits. Env at package time also works:
#   MICROJAINSLEE_CONTAINER_BUFFER_SIZE / _SBB_POOL_MIN / _SBB_POOL_MAX
# Targets ~10k TPS lab (8G heap / ≤15Gi host): ring + SBB ceiling ×10 headroom.
microjainslee.container.buffer-size=16384
microjainslee.container.prefer-virtual-threads=true
microjainslee.container.sbb-pool-min=128
microjainslee.container.sbb-pool-max=40960

# THIS FILE IS THE LAB / GIT DEFAULT — it ships file H2, not PostgreSQL.
# db-kind is BUILD-TIME: switching H2 → PostgreSQL needs a re-run of ./build/package-dist.sh
# with the value already changed here, not just an edit of dist/configs on the server.
# Dedicated DB ussdgw — never reuse OTA's jdbc:postgresql://…/ota.
# DO NOT use jdbc:h2:mem: — routing / tenants / CDR / campaigns vanish on every restart.
# Both drivers ship in the fast-jar (quarkus-jdbc-h2 + quarkus-jdbc-postgresql).
# Prod: set db-kind=postgresql + the jdbc URL below, repackage, and supply the password via
# QUARKUS_DATASOURCE_PASSWORD — never commit it here. See docs/agents/schema.md.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/ussdgw;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
# repair-at-start=false on purpose: a blanket repair rewrites drifted checksums every boot and
# defeats validate-on-migrate. UssdSchemaInitializer repairs once, only when migrate() refuses.
quarkus.flyway.repair-at-start=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=classpath:db/migration
ussd.db.schema-init.enabled=true
# CDR JDBC pool (async flusher batches; 5k sync dual-leg CDR needs >64 under PG)
quarkus.datasource.jdbc.max-size=128
quarkus.datasource.jdbc.min-size=16

# Local file H2 lab (requires rebuild with db-kind=h2):
# quarkus.datasource.db-kind=h2
# quarkus.datasource.username=sa
# quarkus.datasource.jdbc.url=jdbc:h2:file:./data/ussdgw;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
# After squash of V1: wipe lab H2 (dist/data/ussdgw*) or reset PG flyway_schema_history.
# All app HTTP via ra-http-server
quarkus.http.host-enabled=false
http.ra.port=8088
http.ra.host=0.0.0.0
# Vert.x HTTP RA — runtime (HttpApplyService). 0 event-loop = Vert.x default (2×cores).
# Worker pool serves executeBlocking(fireEvent); Vert.x default 20 caps ingress hard.
http.ra.event-loop-threads=8
# Worker pool: executeBlocking(fireEvent). 512 supports ~5k concurrent ingress waits better than 256.
http.ra.worker-pool-size=512
http.ra.accept-backlog=8192
# Outbound AS pull / callback WebClient pool — must cover concurrent SYNC waits (5k users ⇒ ≥5k+ headroom).
ussd.http.client.max-pool-size=8192
ussd.http.client.connect-timeout-ms=5000
ussd.http.client.request-timeout-ms=15000

# ── Admin credentials ────────────────────────────────────────────────────────
# LAB ESCAPE HATCH. While this is true the node boots with the built-in default admin
# credentials and only logs a warning. Set false (or delete the line) for production: startup
# then FAILS until ussd.admin.session-hmac-secret and ussd.admin.api-key are changed.
# The HMAC secret is the critical one — knowing it is enough to forge an ADMIN session cookie.
ussd.lab.allow-default-secrets=true
# Override without editing this file: USSD_ADMIN_API_KEY / USSD_ADMIN_SESSION_HMAC_SECRET.
# Accepted only in the X-USSD-Admin-Key header — ?key= is no longer honoured.
ussd.admin.api-key=${USSD_ADMIN_API_KEY:ussd-admin}
# Operator-facing base for NI/gRPC push URLs (never 0.0.0.0). Lab default = local RA.
ussd.admin.public-base-url=${USSD_ADMIN_PUBLIC_BASE_URL:http://127.0.0.1:8088}
ussd.bridge.enabled=true
# Gate budget for GATE_ARMED (MAP2MAP hop + MO AS + NI park). Live deadline = this ceiling
# (not EWMA×1.5). EWMA remains for telemetry / observed_ewma_ms only. Keep under MAP dialog (~30–60s).
ussd.bridge.async-gate-timeout-ms=25000
ussd.dialog-timeout-ms=60000
ussd.bridge.async-wait-message=Please wait...
ussd.bridge.async-hard-fail-message=ማው ማውማው ማውማው ማውማው ማው
ussd.bridge.gate-tick-ms=100
ussd.bridge.http-client-enabled=true
ussd.bridge.grpc-client-enabled=true
ussd.alphabet.default=AUTO
ussd.as.http.wire-format=xml
ussd.http.ni-path=/ussd
# Classic NI /ussd auth (Digicom prod=true). Lab opt-out: false.
ussd.http.ni.auth-required=true
# AS pull circuit — slightly looser under load (env: USSD_AS_PULL_FAIL_THRESHOLD)
ussd.as.pull.fail-threshold=20
ussd.as.pull.open-ms=15000
ussd.as.pull.max-retries=1
ussd.map.enabled=true
ussd.map.auto-apply-on-boot=true
ussd.map.config-file=configs/ss7-lab.json
# Lab OPC (ss7-lab.json PC 1). Override on operator host for live peers.
ussd.map.opc=1
ussd.ss7.persist-dir=configs/ss7-persist
# HLR face / NI SRI-SM CalledParty (admin /admin/hlr overlay wins when non-blank)
ussd.hlr.mode=PROXY_MAP
ussd.hlr.upper-gt=251900000006
ussd.map.ussd-gt=251900000100
ussd.grpc.server.port=9099
ussd.seed.http-url=http://127.0.0.1:8090/ussd/pull
ussd.seed.grpc-target=127.0.0.1:9090
ussd.seed.grpc-method=et.restlink.ussdgw.as.UssdAs/Pull

# SMPP bind credentials — supply via SMPP_PASSWORD / SMPP_SERVER_PASSWORD on any real peer.
# The literal fallbacks exist only so the local ESME sim keeps binding out of the box.
smpp.client.enabled=false
smpp.host=127.0.0.1
smpp.port=2775
smpp.system-id=restlink
smpp.password=${SMPP_PASSWORD:password}
smpp.source-addr=RESTLINK
smpp.server.enabled=true
smpp.server.port=2776
smpp.server.system-id=ussdgw
smpp.server.password=${SMPP_SERVER_PASSWORD:password}
smpp.auto-apply-on-boot=true

# Access feature flags (RA listen/peer = micro-jainslee ra-diameter / ra-sip-servlet)
ussd.diameter.enabled=false
ussd.sip.enabled=false
ussd.smpp.ussd.enabled=false
ussd.tx.profile-ttl-ms=120000

# CDR — OTA-style async JDBC batch into ussd_cdr (H2 PG-mode lab / PostgreSQL prod)
# At ~10k TPS dual-leg ≈ 20k CDR/s peak; queue-cap ≈ 5s burst, batch 2k / 100ms flush.
ussd.cdr.enabled=true
ussd.cdr.network-id=0
ussd.cdr.db.async=true
ussd.cdr.db.batch-size=2000
ussd.cdr.db.queue-cap=100000
ussd.cdr.db.flush-every=100ms

# NI push campaigns
ussd.campaign.enabled=true
ussd.campaign.claim-limit=10
ussd.campaign.max-targets=5000

# Admin disk UI (OTA shell)
ussd.admin.ui-dir=app/html
ussd.admin.session-hmac-secret=${USSD_ADMIN_SESSION_HMAC_SECRET:ussd-dev-session-hmac-change-me}
# Lab first-run ADMIN form login (username=admin). Leave password blank for a random password
# printed to the CONSOLE only (never into dist/logs/).
ussd.admin.first-run-seed=true
ussd.admin.first-run-password=${USSD_ADMIN_FIRST_RUN_PASSWORD:ussd-admin}
# bcrypt cost for ussd_admin_user.password_hash. Legacy SHA-256 rows are re-hashed on login.
ussd.admin.password.bcrypt-cost=10
# LAB ESCAPE HATCH — the Digicom lab is plain HTTP behind nginx :80, so the session cookie
# cannot carry Secure. Delete this line once TLS terminates at nginx :443 (default is true).
ussd.admin.cookie-secure=false
# Double-submit CSRF on cookie-authenticated admin POSTs. ussd-shell.js echoes the
# ussd_admin_csrf cookie back in X-USSD-CSRF. Set false only to debug the shell.
ussd.admin.csrf.enabled=true

# AS URL SSRF guard for short-code rules (a TENANT can set asUrl). Private / loopback /
# link-local / metadata targets are refused unless listed here. The lab AS is on 127.0.0.1.
ussd.as.url.host-allowlist=127.0.0.1,localhost,::1
ussd.as.url.allow-private-hosts=false
# DNS lookups happen on the admin request thread — off by default to keep that non-blocking.
ussd.as.url.resolve-dns=false

# Rate-limit ceiling for untenanted traffic (ussd_short_code.tenant_id is nullable).
# 0 or negative = unlimited (pre-2026-08 behaviour).
ussd.tenant.global-max-tps=20000

# Diameter / SIP RA listen (wire when ussd.*.enabled=true)
ussd.diameter.host=0.0.0.0
ussd.diameter.port=3868
ussd.diameter.realm=restlink.local
ussd.diameter.origin-host=ussdgw.restlink.local
# omit destination-host when unset — empty value breaks SmallRye String config
ussd.diameter.destination-realm=restlink.local
ussd.diameter.auto-apply-on-boot=true
ussd.sip.host=0.0.0.0
ussd.sip.tcp-port=5060
ussd.sip.udp-port=5060
ussd.sip.from-uri=sip:ussdgw@restlink.local
ussd.sip.request-uri-template=sip:{msisdn}@ussd.restlink.local
ussd.sip.auto-apply-on-boot=true
