# Digicom-ET USSDGW — OS/SCTP socket buffers for USSD capacity headroom (5k-oriented).
# Install: build/systemd/install-on-digicom.sh (copies to /etc/sysctl.d/ + sysctl -p).
# Lab/public hosts may apply the same drop-in; values are not carrier secrets.
#
# Baseline (Digicom 2026-08-09 pcap/prove): a_rwnd ≈ 106496 (~104 KiB) with
#   net.core.rmem_max = wmem_max = 212992 (stock Linux). /proc/net/sctp/assocs
#   showed sndbuf=rcvbuf=212992 on BP links 2011/2019.
#
# Rationale (bytes, not magic):
# - Typical USSD/MAP DATA chunk ≈ 0.5–2 KiB on the wire. At ~5k TPS with
#   ~100–200 ms RTT, dual-link burst needs thousands of in-flight receive
#   credits; ~104 KiB a_rwnd is only ~50–200 msgs of window — fine for one
#   call, tight under load.
# - Linux caps SO_RCVBUF/SO_SNDBUF at net.core.rmem_max / wmem_max. SCTP then
#   advertises a_rwnd ≈ rcvbuf/2 (sk_buff overhead). Raising max unlocks
#   net.sctp.sctp_rmem / sctp_wmem (min default max).
# - Shared Digicom host (~15 GiB RAM + OTA): use OTA-lab class 64 MiB max and
#   4 MiB SCTP default — not the dedicated OTA server 1 GiB profile.
# - Expected after ussdgw restart: /proc/net/sctp/assocs rcvbuf/sndbuf ≈ 4 MiB
#   (kernel may report ~8 MiB if it doubles); INIT/SACK a_rwnd ≈ 2 MiB.
# - Does NOT by itself prove 5k TPS (heap/pools/AS still required).
#
# jSS7 Ss7Config.Link does not yet wire optionSoRcvbuf/optionSoSndbuf; OS
# defaults after this drop-in are the Digicom path. Do not overwrite Digicom
# SS7 topology JSON just to chase buffers.

net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
net.sctp.sctp_rmem = 4096 4194304 67108864
net.sctp.sctp_wmem = 4096 4194304 67108864
