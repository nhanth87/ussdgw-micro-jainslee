# PostgreSQL tuning for the ussdgw host share: 12 CPUs / 32 GiB (capacity_5k_tps.md §6.6).
# ussdgw load on PG is light at 5k TPS (CDR DB mirror off): routing/tenant/user reads,
# Flyway, admin. Sized for headroom, not for a write-heavy OLTP.

listen_addresses = '127.0.0.1'          # host network; never public (plan.md D4/D5)
port = 5432
max_connections = 200                   # ussdgw pool 48 + admin/backup/monitoring
password_encryption = scram-sha-256

# Memory (32 GiB container)
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 32MB
maintenance_work_mem = 2GB
huge_pages = try

# CPU (12)
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4

# WAL / checkpoints
wal_level = replica
wal_compression = on
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 64MB
synchronous_commit = on

# Planner (SSD/NVMe)
random_page_cost = 1.1
effective_io_concurrency = 200

# Housekeeping
autovacuum_max_workers = 4
autovacuum_naptime = 30s
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
