# No `user` directive. It used to say `user nginx;`, which was wrong twice over:
# Ubuntu's nginx package has no `nginx` user (that alone broke the old Dockerfile's
# `chown nginx:nginx`), and the directive is ignored outright when the master
# process is not super-user:
#
#     [warn] the "user" directive makes sense only if the master process runs
#            with super-user privileges, ignored in /etc/nginx/nginx.conf:1
#
# docker/nginx/Dockerfile sets `USER nginx` (uid 101) and docker/stack.yml grants
# only CAP_NET_BIND_SERVICE, so workers already run as nginx without this line, and
# a proxy bug is never root on the host. Adding it back just produces a warning on
# every single start.
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

# /tmp, not /var/run. nginx creates this file itself, and /var/run is root-owned
# mode 755, so a uid-101 master dies before it can serve anything:
#
#     [emerg] open() "/var/run/nginx.pid" failed (13: Permission denied)
#
# The previous Dockerfile papered over this with `touch /var/run/nginx.pid &&
# chown nginx:nginx`, which only works while nothing remounts /run as a tmpfs —
# i.e. it breaks the moment an operator adds a tmpfs mount. /tmp is writable and
# predictable, and a pid file has no reason to live anywhere special.
pid        /tmp/nginx.pid;

# `worker_rlimit_nofile` raises the per-worker descriptor limit, which
# `events.worker_connections` is allowed to draw on. Without it the container's
# soft limit (1024/2048 by default, and docker/stack.yml set ulimits only on the
# ussdgw service) silently caps the connections:
#
#     [warn] 4096 worker_connections exceed open file resource limit: 2048
#
# docker/stack.test.yml now sets ulimits.nofile on the nginx service to match, so
# the three numbers below, the service ulimit and the worker's hard limit agree.
worker_rlimit_nofile 8192;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version.
    server_tokens off;

    log_format ussdgw '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log ussdgw;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    client_max_body_size 4m;

    # Everything lives on the host network (plan.md §3): the gateway binds real
    # host IPs over SCTP and must not be load-balanced, so proxy to loopback.
    #
    # The upstream is declared HERE, ONCE. It used to be declared in this file AND
    # again at the top of conf.d/ussdgw.conf, and nginx rejects the second
    # definition outright:
    #
    #     [emerg] duplicate upstream "ussdgw_app" in /etc/nginx/conf.d/ussdgw.conf:7
    #
    # which made the nginx container impossible to start — a defect that survived
    # unnoticed because docker/prove.sh only logged "nginx not answering on :80
    # (expected if not deployed yet)". conf.d/ussdgw.conf now only references the
    # name. `docker/nginx/Dockerfile` runs `nginx -t` at build time precisely so a
    # second definition can never be committed again.
    upstream ussdgw_app {
        server 127.0.0.1:8088 max_fails=0;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}