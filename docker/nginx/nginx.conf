user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version.
    server_tokens off;

    log_format ussdgw '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log ussdgw;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    client_max_body_size 4m;

    # Everything lives on the host network (plan.md §3): the gateway binds real
    # host IPs over SCTP and must not be load-balanced, so proxy to loopback.
    upstream ussdgw_app {
        server 127.0.0.1:8088 max_fails=0;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}