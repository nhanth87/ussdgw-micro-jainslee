# Public entry point for the gateway.
#
# Ports: nginx :443 -> 127.0.0.1:8088, and :80 only for /healthz, /metrics and the ACME
# challenge. Everything else on :80 is redirected to :443.
# The request said "8080"; the app's real port is 8088 because the HTTP plane is
# the vert.x RA (quarkus.http.host-enabled=false). Nothing listens on 8080.
#
# The upstream `ussdgw_app` is defined ONCE, in nginx.conf. Defining it here too
# was an emerg: `duplicate upstream "ussdgw_app"`. Do not re-add it.

# --- health probe (not proxied, never public) --------------------------------
server {
    listen 80;
    server_name _;
    access_log off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Prometheus scrape: allow-listed management networks only -------------
    # /metrics exposes operational detail (link state, pool sizes). It must never
    # be world-readable. Replace these networks with the monitoring host(s).
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://ussdgw_app;
    }

    # --- everything else: HTTPS only ------------------------------------------
    # NOT a proxy. This block used to proxy `location /` straight to the app, which put
    # the whole admin surface — login form, session cookie, CSRF-free forms — on
    # 0.0.0.0:80 in cleartext on a carrier host, alongside M3UA. Two of those reads
    # were nearly reported the wrong way round: `curl http://host:80/admin/routing`
    # answers 302 http://127.0.0.1/admin/login, and that redirect is the APPLICATION's
    # auth redirect, not nginx forwarding to 443. It "looked like" :80 was already
    # redirecting to TLS, which is how a cleartext admin login survives a deploy.
    #
    # Now :80 answers only /healthz (not proxied), /metrics (allow-listed networks, to
    # keep the Prometheus scrape working) and the ACME challenge, and sends everything
    # else to :443 where TLS terminates. /healthz stays plain HTTP because the container
    # healthcheck and prove.sh both hit it.
    location = /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else goes to :443, where TLS terminates.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- TLS ----------------------------------------------------------------------
# :443 is REQUIRED, not optional.
#
# The comment that used to stand here claimed "Enabled only when certs are mounted.
# No cert means no :443 server block, so the container still starts cleanly on an
# HTTP-only first deployment". That was false: the block below is unconditional, so
# nginx refuses to start at all when the files are absent:
#
#     [emerg] cannot load certificate "/etc/nginx/certs/fullchain.pem":
#             BIO_new_file() failed (SSL: error:80000002:system library::
#             No such file or directory)
#
# There is no conditional include that could express "only when present" here, and
# the honest fix is the one below rather than shipping an HTTP-only gateway on a
# carrier host: an operator-facing admin UI that silently downgrades to cleartext
# is a worse failure than a container that refuses to start and says why.
#
# Certificates are bind-mounted from the host (docker/stack.test.yml) so they are
# inspectable and rotatable without rebuilding. docker/install-config.sh --check
# verifies they exist, are readable by uid 101 and are not expired BEFORE the stack
# is deployed; docker/nginx/Dockerfile proves the rest of this file parses.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://ussdgw_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
    }
}