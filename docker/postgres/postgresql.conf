# PostgreSQL 16 — tuned for the USSD gateway.
#
# Sized for a shared SS7 host that also runs the gateway JVM. The database is a
# hard boot dependency: if PostgreSQL is memory-starved and gets OOM-killed, the
# gateway cannot serve Flyway, profiles or CDR. Deliberately conservative —
# an over-tuned database on a small host is a reliability problem, not a speedup.

listen_addresses = '127.0.0.1'
port = 5432

# --- memory -------------------------------------------------------------------
# The JVM takes -Xms2g -Xmx4g (AGENTS.md heap rule). Give PG a small, predictable
# footprint and let the kernel reclaim rather than OOM-killing.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# --- connections ---------------------------------------------------------------
# Gateway JDBC pool is max-size=128 (see application.properties). 100 leaves room
# for Flyway, operator sessions and pg_isready without risking
# "sorry, too many clients already".
max_connections = 100
superuser_reserved_connections = 3

# --- durability ----------------------------------------------------------------
# CDR rows and profile state must survive a power cut; the gateway can replay a
# lost transaction, but losing the session ledger is not acceptable.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
synchronous_commit = on

# --- planner -------------------------------------------------------------------
# The workload is many small keyed lookups (one row per correlation, one per
# MSISDN profile) — favour index scans over elaborate joins.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- logging -------------------------------------------------------------------
# Keep it honest but quiet; the gateway's own Log4j2 files are the real log.
logging_collector = off
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_connections = off
log_disconnections = off

# --- locale / timezone ---------------------------------------------------------
# Timestamps in CDR and MAP timers must not shift with the host locale. UTC inside
# the container, Africa/Addis_Ababa only for display (set in the ussdgw image).
timezone = 'UTC'
datestyle = 'iso, mdy'

# --- durability of the audit trail ---------------------------------------------
# Log statements that change data. This is a billing/telecom-adjacent record;
# keeping it makes any schema question answerable after the fact.
log_statement = 'ddl'