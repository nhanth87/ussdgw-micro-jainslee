corsac-diameter|https://github.com/mobius-software-ltd/corsac-diameter.git|diameter-parent-10.0.0-41|0bc4629186a7153ab365568c3c8d7e340c77d862

# NOTE on corsac-diameter (plan.md §1.1):
#   ra-diameter needs `10.0.0-41-SNAPSHOT`, which is NOT on Maven Central (HTTP 404)
#   and was NOT reproducible from the workspace clone (which only had 34-SNAPSHOT).
#   The SHA above is the upstream "prepare for next development iteration" commit
#   whose pom.xml literally reads 10.0.0-41-SNAPSHOT. We install it AS-IS — we are
#   not rewriting version coordinates to fake a release.
#
# NOTE on the version bump (2026-10-02):
#   micro-jainslee 1.2.1-SNAPSHOT on jSS7 9.2.9-j25, released together and pushed
#   together, so neither is an unresolvable coordinate:
#     jss7       dfac9bbe1  release/9.2.9-j25  (j25 @ b394f6d60 + the release commit)
#     jain-slee  0538b082f  1.2.1-SNAPSHOT, jss7.version 9.2.9-j25
#   ussdgw's pom.xml carries microjainslee.version=1.2.1-SNAPSHOT; the jss7 version
#   arrives transitively through ra-jss7, so there is a single place to change.
#   0538b082f also corrects nested <relativePath> ../../../pom.xml -> ../../pom.xml,
#   which was the documented bootstrap gotcha (leaf modules pointed at the wrong POM).
#
#   Chain behind it, all pushed and auditable:
#     31873d44c  ra-jss7 per-link SCTP bounce
#     3e1c82f4b  ra-jss7 per-association / per-AS admin state   <- what Digicom runs
#     13cf321bd  active/active cluster wiring (ADR 0007)
#     b394f6d60  jss7 ss7-config `ri` override + TcapDialogSnapshot.PendingInvoke
#
#   There is NO local patch anywhere in this chain any more: every delta is a commit.

