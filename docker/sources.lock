# sources.lock — the audited source chain for the Digicom-ET USSDGW Docker build
#
# WHAT THIS FILE IS FOR (R3, customer requirement):
#   The operator must be able to audit the codebase. We ship no prebuilt binaries.
#   Every line below is either (a) an in-house git repo pinned to an exact commit,
#   or (b) a source tarball pinned to a SHA-256 digest. The builder REFUSES to
#   compile if any entry cannot be verified.
#
# HOW IT IS ENFORCED (see build/fetch-sources.sh + build/verify-sources.sh):
#   1. fetch-sources.sh checks out / verifies each entry (SOURCE_MODE=local|git).
#   2. verify-sources.sh re-hashes what was actually used and compares to this file.
#   3. build-all.sh records every SHA it consumed into /out/BUILD-INFO.json.
#   4. The CycloneDX SBOM in /out/sbom lists every resulting jar.
#
# TRUST BOUNDARY (plan.md §2 D1, Option A — owner-approved):
#   Built from source : sctp, jss7, jain-slee (micro-jainslee + all RAs),
#                       corsac-diameter, ussdgw
#   Pinned upstream   : Ubuntu 26.04 LTS base image (by digest), OpenJDK 25 (by
#                       digest), Maven, Maven Central dependencies, PostgreSQL 16
#                       (by digest) and nginx 1.27-alpine (by digest).
#   Every one of those is digest-pinned or checksum-verified, and appears in the
#   SBOM. There is no "trust me" link in the chain.

# ---------------------------------------------------------------------------
# IN-HOUSE GIT REPOSITORIES  (format: <name>|<url>|<branch-or-tag>|<commit-sha>)
# ---------------------------------------------------------------------------
# The commit SHA is authoritative. Branch names are documentation only and are
# IGNORED by the verifier — a moved branch cannot silently change what we build.

