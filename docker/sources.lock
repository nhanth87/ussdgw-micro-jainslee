jss7|https://github.com/nhanth87/jss7.git|j25|d8514680057063c54f2c5bbb2bae475287d15e20

jain-slee|https://github.com/nhanth87/jain-slee.git|micro-jainslee-2|31873d44c3d49dd0372529e04bb26441b1f675ea

corsac-diameter|https://github.com/mobius-software-ltd/corsac-diameter.git|diameter-parent-10.0.0-41|0bc4629186a7153ab365568c3c8d7e340c77d862

# NOTE on corsac-diameter (plan.md §1.1):
#   ra-diameter needs `10.0.0-41-SNAPSHOT`, which is NOT on Maven Central (HTTP 404)
#   and was NOT reproducible from the workspace clone (which only had 34-SNAPSHOT).
#   The SHA above is the upstream "prepare for next development iteration" commit
#   whose pom.xml literally reads 10.0.0-41-SNAPSHOT. We install it AS-IS — we are
#   not rewriting version coordinates to fake a release.
#
# NOTE on jain-slee (resolved 2026-10-02):
#   The Digicom host runs a ra-jss7 built from 3e1c82f4b, which was never pushed.
#   That provenance gap is now CLOSED: 13cf321bd (active/active ADR 0007),
#   3e1c82f4b (per-association / per-AS admin state) and 31873d44c (per-link SCTP
#   bounce) are pushed to BOTH nhanth87/jain-slee and digicom-et/jain-slee, and the
#   pin above is their tip. The Digicom artifact and the Docker build now trace to the
#   same auditable commit.
#
#   HELD BACK ON PURPOSE: 0538b082f bumps micro-jainslee to 1.2.1-SNAPSHOT and jss7
#   to 9.2.9-j25. nhanth87/jss7@j25 is still 9.2.8-j25 and no workspace tree declares
#   9.2.9-j25, so publishing it would advertise a dependency nobody can resolve.
#   Push it once jss7 9.2.9-j25 is on GitHub, then move this pin to its successor.
#
#   This SHA declares the ADR 0007 `Ss7MapEvent.Remote` subtype, so the ussdgw SBB
#   handles all four subtypes. Its version is still 1.2.0-SNAPSHOT / 9.2.8-j25, so no
#   ussdgw pom change is needed.

# ---------------------------------------------------------------------------
# PATCHES APPLIED TO PINNED SOURCES  (format: <file>|<target-repo>|<sha256>)
# ---------------------------------------------------------------------------
# A pinned commit is not always self-consistent with the pinned consumer. Here,
# jain-slee's ra-jss7 needs Ss7Config.Addr.ri, which nhanth87/jss7 j25 does not
# have, so jss7 does not compile. Rather than carry an implicit local edit — which
# is precisely the unprovable provenance R3 forbids — the delta is a reviewable
# file with a recorded digest. The builder applies it and fails loudly if the
# pinned upstream ever changes underneath it.
#
# Ground truth: decompiled from the artifact Digicom runs. The pre-patch backup
# (ss7-config-9.2.8-j25.jar.bak-092725) has 7 Addr components; the running jar has
# 8, the last named "ri".

jss7-ss7-config-kernel-sctp.patch|jss7|sha256:f1a8a92fd5da34482dd3ace226120d6a75c1c4ca0a5a364f65ec6ba430eea6d1

