# THE PRODUCT ITSELF  (this repository)
# ---------------------------------------------------------------------------
# ussdgw is built from the checkout mounted at /src/ussdgw, NOT cloned — the
# operator hands over the tree they audited. Its commit is recorded at build time
# from `git rev-parse HEAD` (or the source tarball's SHA-256), and lands in
# /out/BUILD-INFO.json. Nothing to pin here.

