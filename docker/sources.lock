# The nginx edge image (owner decision 2026-10-02).
#
# This replaced an `apt install nginx` layer on top of base-ubuntu, which could not
# build: Ubuntu's nginx package never creates a `nginx` user (it uses `www-data`),
# so `chown -R nginx:nginx` failed with exit code 1. The official image ships the
# user, the entrypoint and the template engine already, and — unlike an apt package
# resolved at build time — it is pinned by digest here like every other base.
#
# Digest verified with:
#   docker buildx imagetools inspect nginx:1.27-alpine
base-nginx|docker.io/library/nginx:1.27-alpine|sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10

