# NOTE on corsac-diameter (plan.md §1.1):
#   ra-diameter needs `10.0.0-41-SNAPSHOT`, which is NOT on Maven Central (HTTP 404)
#   and was NOT reproducible from the workspace clone (which only had 34-SNAPSHOT).
#   The SHA above is the upstream "prepare for next development iteration" commit
#   whose pom.xml literally reads 10.0.0-41-SNAPSHOT. We install it AS-IS — we are
#   not rewriting version coordinates to fake a release.
#
# NOTE on jain-slee (2026-10-02, resolved):
#   The whole ADR 0007 / ra-jss7 chain is now on GitHub and BUILDABLE:
#     jss7        b394f6d60  j25 — ss7-config `ri` routing-indicator override + ADR 0007
#                              TcapDialogSnapshot.PendingInvoke (2204e8fb4)
#     jain-slee   31873d44c  ra-jss7 per-link SCTP bounce (on top of the two below)
#                  3e1c82f4b  per-association / per-AS admin state  <- what Digicom runs
#                  13cf321bd  active/active cluster wiring
#   This closes the provenance gap end to end: the artifact Digicom runs and the one
#   this Docker build produces now trace to the same pushed commits, with NO local patch.
#
#   jss7 release/9.2.9-j25 (dfac9bbe1) is also pushed, which is what unblocks
#   jain-slee 0538b082f (micro-jainslee 1.2.1-SNAPSHOT on jss7 9.2.9-j25). That bump is
#   still held back: moving ussdgw to 1.2.1-SNAPSHOT is a separate, deliberate step.

