# Digicom-ET USSDGW — Docker Swarm stack (LAB defaults).
#
# All three services share the HOST network, and that is not a shortcut:
#
#   * The gateway binds SCTP on real host IPs (Digicom: 172.16.144.163:2011/2019).
#     SCTP multi-homing puts those addresses inside the INIT chunk, so a bridge
#     network or a swarm ingress mesh hands the peer the wrong source IP. SS7 must
#     not be load-balanced at all.
#   * A container on the host network cannot resolve swarm service names, so
#     postgres and nginx also run here and everything talks over 127.0.0.1.
#   * Consequence: the stack is SINGLE-NODE. `replicas: 1` plus a node label keeps
#     the gateway pinned to the node the carrier peers actually whitelist.
#
# The Digicom variant (stack.digicom.yml) lives only on the private `digicom`
# branch — never on public main.

version: "3.9"

networks:
  hostnet:
    external: true
    name: host

volumes:
  ussdgw-configs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/ussdgw/configs
  ussdgw-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/ussdgw/logs
  ussdgw-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/ussdgw/data
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/ussdgw/pgdata
  nginx-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/ussdgw/nginx/certs

secrets:
  ussdgw_db_password:
    external: true
  ussdgw_admin_key:
    external: true
  # Superuser credential for the postgres container (see services.postgres). Create it
  # before deploying, or postgres exits 1 with "Database is uninitialized and superuser
  # password is not specified" — and with restart_policy: max_attempts: 5 the task is
  # then retired, so `docker stack services` keeps listing a database that never
  # initialised while the gateway waits for it forever.
  #   openssl rand -base64 24 | tr -d '\n=' | docker secret create ussdgw_pg_super_password -
  ussdgw_pg_super_password:
    external: true

services:

  postgres:
    # NOT the stock upstream postgres image. docker/postgres/Dockerfile layers in
    # two things this service cannot work without:
    #
    #   * docker/postgres/initdb/01-ussdgw.sh — creates the `ussdgw` role and the
    #     dedicated `ussdgw` database. Without it the gateway connects as
    #     username=ussdgw and PostgreSQL answers
    #     `FATAL: role "ussdgw" does not exist`, so the gateway cannot start.
    #
    #   * postgresql.conf, which pins listen_addresses to 127.0.0.1. The upstream
    #     image ships listen_addresses = '*' so that -p publishing works; on hostnet
    #     there is no publishing step to mask it, so 5432 would bind on every
    #     interface of a carrier host.
    #
    # The default names the image docker/build/build-images.sh builds, and that script
    # asserts both properties inside the image before reporting success. Overriding
    # POSTGRES_IMAGE back to a bare `postgres:16` reinstates both faults.
    image: ${POSTGRES_IMAGE:-ussdgw-postgres:latest}
    networks: [hostnet]
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - source: ussdgw_db_password
        target: ussdgw_db_password
        uid: "999"
        gid: "999"
        mode: 0400
      # The superuser (POSTGRES_USER below) needs its own credential, and the official
      # image REFUSES TO INITIALISE without one:
      #
      #   Error: Database is uninitialized and superuser password is not specified.
      #          You must specify POSTGRES_PASSWORD to a non-empty value for the
      #          superuser.
      #
      # It is deliberately NOT the same secret as ussdgw_db_password: that one is the
      # application role `ussdgw`, created by initdb/01-ussdgw.sh, and the gateway is
      # the only consumer. Sharing one credential between the app role and a superuser
      # would mean a leaked JDBC password is also DDL/role-administration on the host.
      - source: ussdgw_pg_super_password
        target: ussdgw_pg_super_password
        uid: "999"
        gid: "999"
        mode: 0400
    environment:
      POSTGRES_USER: ussdgw_admin
      POSTGRES_DB: ussdgw_admin
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Read from the secret, never POSTGRES_PASSWORD inline: an inline value is visible
      # in `docker service inspect`, in the swarm raft log and in shell history.
      POSTGRES_PASSWORD_FILE: /run/secrets/ussdgw_pg_super_password
      USSD_DB_PASSWORD_FILE: /run/secrets/ussdgw_db_password
      # PGDATA must be the mounted volume root; the image defaults to a subdir that
      # does not exist on a fresh bind mount.
      PGDATA: /var/lib/postgresql/data/pgdata
    # Loopback only (set in postgresql.conf). NOT published: exposing 5432 would put
    # the USSD database on the network for no benefit.
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.ussdgw == true]
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ussdgw:
    image: ${USSDGW_IMAGE:-ussdgw:latest}
    networks: [hostnet]
    volumes:
      - ussdgw-configs:/opt/ussdgw/configs
      - ussdgw-logs:/opt/ussdgw/logs
      - ussdgw-data:/opt/ussdgw/data
    secrets:
      # uid/gid are REQUIRED, not optional. A secret is mounted 0400 owned by root, and
      # this service runs as uid 10001 — without an explicit uid/gid the gateway cannot
      # read its own DB password and the entrypoint aborts with
      # "no database password". Proven by running the image by hand.
      - source: ussdgw_db_password
        target: ussdgw_db_password
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: ussdgw_admin_key
        target: ussdgw_admin_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    # LIVENESS ONLY — and the reason this block exists is a gateway that was killed for
    # being healthy. The image's own HEALTHCHECK sent
    #
    #     -H "X-USSD-Admin-Key: ${USSD_ADMIN_API_KEY:-}"
    #
    # and got 401 on every single probe, so once start-period elapsed Swarm SIGTERM'd a
    # gateway that had finished booting, wired SS7 and was serving /admin/status.json:
    #
    #     Failed … "task: non-zero exit (143): dockerexec: unhealthy container"
    #
    # Two independent reasons that probe could never pass:
    #   * HEALTHCHECK runs as its own `docker exec`. It sees the image's Config.Env and
    #     nothing else — in particular nothing entrypoint.sh exports.
    #   * USSD_ADMIN_API_KEY does not set this deployment's admin key. The key in force is
    #     ussd.admin.api-key from the mounted configs/application.properties, and the env
    #     var was inert. Proved on the running container: `ussd-admin` → 401, the
    #     properties value → 200. So the stack was shipping a lab default that changed
    #     nothing while the healthcheck trusted it.
    # The probe now reads the swarm secret file, which holds the same value as the property.
    #
    # -K - passes the header through curl's stdin config rather than argv, because
    # `docker top` on the host shows container argv: a key in argv is a key in the host's
    # process table.
    #
    # 401 is ACCEPTED. Liveness here means "the vert.x RA accepted a connection and routed
    # it to the admin handler", and a 401 proves exactly that. Whether the operator's key is
    # right is docker/prove.sh's job. A liveness probe that restarts the gateway over a
    # credential question turns one config mistake into an outage — and with
    # max_attempts: 5, into a retired task and a service that is listed but never runs.
    healthcheck:
      # Overrides the image's own HEALTHCHECK with the identical probe, so that a
      # `docker run` and a `docker stack deploy` cannot disagree about what "up" means.
      test: ["CMD", "/usr/local/bin/ussdgw-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    environment:
      # Read by the healthcheck above. The gateway itself takes the admin key from
      # ussd.admin.api-key in configs/application.properties — do not add a
      # USSD_ADMIN_API_KEY here: it does not override that property, it plants the built-in
      # lab default `ussd-admin` in the deploy path, and if it ever did take effect
      # DefaultSecrets would refuse to boot (ussd.lab.allow-default-secrets=false).
      USSD_ADMIN_API_KEY_FILE: /run/secrets/ussdgw_admin_key
      USSD_DB_PASSWORD_FILE: /run/secrets/ussdgw_db_password
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      # Heap: lab-safe defaults per AGENTS.md. A shared SS7 host cannot spare 8 GB
      # to one container. Raise only on a dedicated node.
      USSD_XMS: ${USSD_XMS:-2g}
      USSD_XMX: ${USSD_XMX:-4g}
      TZ: Africa/Addis_Ababa
    depends_on: [postgres]
    # Give live MAP dialogs time to end/abort cleanly on SIGTERM instead of being
    # SIGKILLed mid-dialog. In swarm this is a top-level service key, NOT under
    # deploy (the schema rejects it there, which is a useful failure).
    stop_grace_period: 60s
    deploy:
      # Exactly one instance: two would fight over the same SCTP endpoints and the
      # same Point Code, which on a live network means duplicate dialogs.
      replicas: 1
      update_config:
        # stop-first, NOT start-first. Rolling two instances would put two gateways
        # on the same SCTP endpoints mid-deploy.
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s
      placement:
        constraints: [node.labels.ussdgw == true]
      resources:
        limits:
          # Xmx + JVM overhead + native (netty direct buffers, SCTP) + headroom.
          # Setting this too low gets the JVM OOM-killed mid-dialog.
          memory: ${USSDGW_MEM_LIMIT:-6g}
      restart_policy:
        # A crash loop must be visible, not silently retried forever. max_attempts
        # then on-failure-stop surfaces the failure instead of hiding it.
        condition: on-failure
        delay: 10s
        max_attempts: 5
      
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # No privileged, no extra capabilities: the host network means SCTP is reachable
    # without CAP_NET_ADMIN, and the ports are all > 1024.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: ${NGINX_IMAGE:-ussdgw-nginx:latest}
    networks: [hostnet]
    volumes:
      - nginx-certs:/etc/nginx/certs
    # NOT purely declarative. Docker does not create a NAT rule for a container in host
    # network mode — nginx binds :80/:443 on the host directly — but the Swarm SCHEDULER
    # still reads this block and reserves the host-mode ports. That is not academic: with
    # `order: start-first` below it is what made every nginx update hang, because the new
    # task could not be placed while the old one still held 80/443:
    #     ussdgw_nginx.1  Pending … "no suitable node (host-mode port already in use)"
    # and `docker stack services` reported 1/1 with the NEW image while the OLD container
    # kept serving. Kept so the intent is readable and so a future move off hostnet does
    # not silently lose the entry point; do not read it as evidence of a NAT rule.
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    depends_on: [ussdgw]
    # NET_BIND_SERVICE is granted here so that it stays in the container's bounding set,
    # but on its own it does NOTHING for this service: capabilities in the permitted set
    # belong to uid 0, and the image runs as uid 101. The bind is enabled by the FILE
    # capability baked onto /usr/sbin/nginx in docker/nginx/Dockerfile (asserted there
    # with getcap). Without it nginx dies on its first bind —
    # `[emerg] bind() to 0.0.0.0:80 failed (13: Permission denied)` — five times, and
    # then restart_policy retires the task while `docker stack services` still lists it.
    # Still the ONLY capability added anywhere in this stack: never privileged:true,
    # never CAP_NET_ADMIN or CAP_SYS_ADMIN.
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.ussdgw == true]
      resources:
        limits:
          memory: 256m
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        # stop-first, NOT start-first — and the reason is the `ports:` block above, not
        # downtime preference. Swarm reserves host-mode ports for placement, so with
        # start-first the new nginx task can never be scheduled while the old one holds
        # 80/443. It sits Pending ("no suitable node (host-mode port already in use)")
        # indefinitely, the service still reports 1/1 with the new image, and the previous
        # container keeps serving — an update that looks applied and never happened.
        # A few seconds of :80/:443 downtime is the cheaper failure.
        order: stop-first
        parallelism: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"